[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "act-companion"
version = "0.2.0"
description = "Unofficial desktop dashboard and notifier for activity.act.edu (Moodle)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "requests>=2.31",
    "keyring>=24",
    "platformdirs>=4",
    # The app window (Edge WebView2 on Windows) and tray icon. Elsewhere it falls back to the browser.
    "pywebview>=6; sys_platform == 'win32' or sys_platform == 'darwin'",
    "pystray>=0.19; sys_platform == 'win32'",
    "pillow>=10; sys_platform == 'win32'",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.16", "pillow>=10"]  # only for packaging/build_exe.py

[project.urls]
Homepage = "https://github.com/AlexWeber64/act-companion"
Mirror-GitHub = "https://github.com/Cyverno/act-companion"
Mirror-GitLab = "https://gitlab.com/AlexWeber64/act-companion"

[project.scripts]
act-companion = "act_companion.__main__:main"

[project.gui-scripts]
act-companion-background = "act_companion.__main__:background"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
act_companion = ["static/*", "static/fonts/*"]
