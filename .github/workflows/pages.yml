# Publishes the web app (iPhone home screen, or any browser) on GitHub Pages when a release is published, so it always
# matches the latest release. Run it by hand to publish the current main branch instead.
name: Web app

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the web app
    if: github.repository == 'AlexWeber64/act-companion'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Build
        run: |
          python -m pip install "pillow>=10"
          python web/build.py _site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Publish on GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deploy
